<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="panel.css">
  </head>
  <body>
    <header class="toolbar">
      <input id="filter" type="text" placeholder="URL filter (substring, case-insensitive)" spellcheck="false">
      <button id="clear" type="button">Clear</button>
      <span class="spacer"></span>
      <select id="format">
        <option value="single">Single JSON</option>
        <option value="separate">Separate files</option>
      </select>
      <button id="export" type="button">Export all</button>
      <button id="export-selected" type="button" disabled>Export selected</button>
      <span id="counter" class="counter">0 captured</span>
    </header>

    <main>
      <table id="table">
        <thead>
          <tr>
            <th class="col-check"></th>
            <th class="col-url">URL</th>
            <th class="col-status">Status</th>
            <th class="col-size">Size</th>
            <th class="col-save"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty">No captures yet. Browse the inspected tab with DevTools open.</p>
    </main>

    <footer>
      <div class="log-header">Panel log</div>
      <pre id="log" class="log"></pre>
    </footer>

    <script src="panel.js"></script>
  </body>
</html>
